services:
  - type: web
    name: portfolio-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://luizfelippedev.vercel.app
      - key: CORS_ORIGINS
        value: https://luizfelippedev.vercel.app
      - key: ASSET_BASE_URL
        value: https://your-backend-domain
      # Preencha no dashboard da Render (mantém secretos)
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_REGION
        sync: false
      - key: NOTIFICATION_EMAIL
        sync: false
      - key: NEWSLETTER_CONFIRMATION_URL
        value: https://luizfelippedev.vercel.app/newsletter/confirm
      - key: PASSWORD_RESET_URL
        value: https://luizfelippedev.vercel.app/auth/reset-password
      - key: GROQ_API_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_REQUEST_TIMEOUT_MS
        value: 45000
      - key: GROQ_TEMPERATURE
        value: 0.45
      - key: GROQ_TOP_P
        value: 0.9
